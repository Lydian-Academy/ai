[project]
name = "ai"
description = "A machine learning and data analysis project"
version = "0.0.0"
requires-python = "~=3.13.0"
dependencies = [
    "tensorflow",
    "pandas",
    "numpy",
    "pydot",
    "graphviz",
    "tensorboard"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"